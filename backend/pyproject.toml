[project]
name = "dacha-wagtail"
version = "0.1.0"
description = "dacha.maxdrobin.ru — Wagtail 7 CMS site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Django 5.2 LTS — compatible with Wagtail 7.x
    "django>=5.2,<6.0",
    # Wagtail 7.x LTS
    "wagtail>=7.0,<8.0",
    # Social sharing / Open Graph meta tags
    "wagtail-metadata>=4.0",
    # Database
    "psycopg[binary]>=3.1",
    # Phone validation (preserved from existing booking app)
    "phonenumbers>=8.13",
    # Static files
    "whitenoise>=6.11.0",
    # Production WSGI server
    "gunicorn>=23.0",
    # Rate limiting for spam protection
    "django-ratelimit>=4.1",
    # Content Security Policy
    "django-csp>=4.0",
    # New dependencies
    "django-filter>=25.1",
    "django-tables2>=2.7",
    # JSON API — headless frontend
    "django-ninja>=1.0",
    "django-cors-headers>=4.0",
    # Wagtail headless preview (so /admin/ preview opens in Next.js)
    "wagtail-headless-preview>=0.5",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    # Linting
    "ruff>=0.9.0",
    "djlint>=1.36.0",
    # Type checking
    "mypy>=1.14.0",
    "django-stubs>=5.0.0",
    "types-psycopg2>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "booking",
    "core",
    "dacha",
    "events",
    "faq",
    "home",
    "houses",
    "news",
    "search",
]

[tool.uv]
package = false

# --- Ruff ---
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".env",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "env",
    "node_modules",
    "site-packages",
    "static",
    "frontend",
    "templates",
]
src = ["."]
line-length = 120
target-version = "py312"
respect-gitignore = true

[tool.ruff.lint]
select = ["A", "B", "C", "E", "F", "I", "PD", "PL", "Q", "SIM", "W"]
ignore = ["PLR0913"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["booking", "core", "dacha", "events", "faq", "home", "houses", "news", "search"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# --- MyPy ---
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true

[tool.django-stubs]
django_settings_module = "dacha.settings.test"

# --- Pytest / Coverage ---
[tool.coverage.run]
source = ["booking", "core", "dacha", "events", "faq", "home", "houses", "news", "search"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70

# --- DJLint ---
[tool.djlint]
profile = "django"
indent = 2
