name: hash probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare hashFiles against sha256sum
        env:
          HF: ${{ hashFiles('deploy/caddy.conf.caddy') }}
        run: |
          echo "hashFiles  $HF"
          echo "sha256sum  $(sha256sum deploy/caddy.conf.caddy | cut -d' ' -f1)"
          echo "bytes      $(wc -c < deploy/caddy.conf.caddy)"
          echo "gitblob    $(git hash-object deploy/caddy.conf.caddy)"
          echo "--- tail bytes ---"
          tail -c 20 deploy/caddy.conf.caddy | xxd