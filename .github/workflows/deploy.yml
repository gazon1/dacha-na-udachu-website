name: Deploy to VPS

# Manual production deploy. Push to `main` only builds and publishes an
# image to GHCR (see ci.yml); getting that image onto the VPS is always a
# deliberate action, because `docker compose up` runs `payload migrate`
# before the app starts and DB migrations are not reversible.
#
# Required repository secrets:
#   VPS_HOST, VPS_USER, VPS_PORT, VPS_APP_DIR, VPS_SSH_KEY
on:
  workflow_dispatch:
    inputs:
      skip_route_check:
        description: "Deploy even if the Caddy route differs from the one on the VPS"
        type: boolean
        default: false

# Two manual runs must never interleave — a half-finished
# migrate/seed sequence from one would race the other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dacha-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Set the `production` environment (Settings → Environments) to restrict
    # which maintainers may run this workflow.
    environment: production

    steps:
      # Only needed for the route check below — the deploy itself runs on the
      # VPS, not on the runner.
      - uses: actions/checkout@v7

      # workflow_dispatch lets you pick any ref in the UI. Only main is
      # deployable — otherwise you could ship an arbitrary branch.
      - name: Refuse to deploy a non-default branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy only from main. Refusing to deploy ${{ github.ref_name }}."
          exit 1

      - name: Resolve image tag
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          # docker/metadata-action in ci.yml publishes `type=sha,format=short`,
          # which is a 7-character prefix. Match that exactly.
          echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE:${SHA:0:7} (commit $SHA)"

      # Fails here with a clear message rather than midway through a deploy
      # on the VPS. Public package → no registry login required.
      - name: Verify image exists in GHCR
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::Image $IMAGE:$TAG not found in GHCR. Run the CI build for this commit first (or check the tag format)."
            exit 1
          fi
          echo "Found $IMAGE:$TAG"

      # ubuntu-latest is a fresh VM every run, so ~/.ssh/known_hosts starts
      # empty. Without this the first `ssh` below dies with "Host key
      # verification failed" and never reaches the deploy. Pinning the key
      # here (rather than disabling the check) is what keeps a MITM from
      # silently intercepting the deploy.
      - name: Trust the VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ssh-agent (not a bare openssh-client install) keeps host-key
      # verification on, so a MITM cannot silently intercept the deploy.
      # v0.10.0 takes only `ssh-private-key` — host/username/key/port were
      # removed as inputs, and passing them fails with "ssh-private-key
      # argument is empty". The port travels with each `ssh -p` instead.
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # The route snippet in this repo and the one Caddy actually serves can
      # drift apart: the snippet is applied by Ansible from a developer
      # machine, the image is deployed from here. Shipping a version whose
      # route was never applied is how you get a 502 that "the deploy
      # succeeded". Compare the checksums and fail loudly.
      - name: Check the Caddy route matches this commit
        if: ${{ !inputs.skip_route_check }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          # NOT the hashFiles() context function: it is documented as a
          # SHA-256 of the matched file, but for a byte-identical
          # deploy/caddy.conf.caddy it returned 586899c6... while sha256sum
          # returned e7fa4a68..., so every deploy failed this check while the
          # two sides actually matched. Both sides are hashed here with the
          # same command instead.
          local_sum=$(sha256sum deploy/caddy.conf.caddy | cut -d' ' -f1)
          remote_sum=$(ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "sha256sum /opt/caddy/conf.d/dacha.caddy 2>/dev/null | cut -d' ' -f1" \
            || echo "<missing>")
          echo "repo      $local_sum"
          echo "installed $remote_sum"
          if [ "$remote_sum" != "$local_sum" ]; then
            echo "::error::The Caddy route on the VPS differs from deploy/caddy.conf.caddy (or is absent). Apply it first: just caddy-route"
            exit 1
          fi
          echo "Route is in sync."

      - name: Deploy to VPS
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          export TAG="$TAG"

          # The compose file and migrations live in this directory, so they
          # must match the commit being deployed. `pull --ff-only` refuses to
          # merge or rebase, so a dirty checkout stops the deploy instead of
          # silently rewriting local work.
          if [ -d .git ]; then
            echo "→ Updating deploy checkout..."
            git pull --ff-only
            echo "Deploy checkout is now at \$(git rev-parse --short HEAD) on \$(git rev-parse --abbrev-ref HEAD)"
          else
            echo "::warning::$APP_DIR is not a git checkout — deploying the files as they are on disk."
          fi

          # The health wait runs from this checkout. Git preserves the exec
          # bit, but only for files it tracks as executable — a fresh clone
          # over an older tree, or a checkout copied by something other than
          # git, can leave it 0644 and the call below would die with
          # "Permission denied" after the containers are already recreated.
          if [ ! -x ./scripts/wait-healthy.sh ]; then
            chmod +x ./scripts/wait-healthy.sh
          fi

          echo "→ Current state before deploy:"
          docker compose images || true

          # Record the running image first so a rollback is one command
          # (see runbook in the plan). Best-effort: there may be no
          # container yet on a first deploy.
          docker inspect dacha-app --format '{{index .Config.Image}}' 2>/dev/null \
            > /tmp/dacha-prev-image || echo "unknown" > /tmp/dacha-prev-image
          echo "Previous image: \$(cat /tmp/dacha-prev-image)"

          # Pull BEFORE recreating anything: if the image is unreachable the
          # deploy stops here with the old stack still running.
          docker compose pull

          # `up -d` (not `down`) recreates only changed services, avoiding a
          # full outage. migrate/seed are one-shot jobs with
          # restart: "no" — they run to completion on this same \$TAG before
          # app is created, and a failed migration stops app from starting.
          docker compose up -d --remove-orphans

          # The wait lives in scripts/wait-healthy.sh, which `just local-up`
          # calls too — so "healthy" means exactly the same thing in both
          # places. NOT `docker compose wait`: that blocks until containers
          # STOP, which a long-running service never does, so it would burn
          # the whole timeout on every deploy and then continue as if nothing
          # were wrong.
          ./scripts/wait-healthy.sh dacha-app 300

          echo "→ Final state:"
          docker compose ps
          EOF

      # Runs from the runner through the public domain, so it also proves
      # Caddy, TLS and the network path are healthy — not just the container.
      - name: Smoke test
        env:
          SMOKE_URL: https://dacha.maxdrobin.ru
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 15 "$SMOKE_URL/api/health" | grep -q '"ok"'; then
              echo "✅ Site healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "Attempt $i: not healthy yet, retrying in 15s"
            sleep 15
          done
          echo "::error::Site did not become healthy after 10 attempts"
          echo "Rollback: cd \$VPS_APP_DIR && export TAG=<prev-sha-from /tmp/dacha-prev-image> && docker compose up -d"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`$IMAGE:${{ steps.meta.outputs.tag }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"