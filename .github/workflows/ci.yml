name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dacha_test
          POSTGRES_USER: dacha
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run migrations
        env:
          POSTGRES_DB: dacha_test
          POSTGRES_USER: dacha
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
        run: |
          cd dacha
          uv run python manage.py migrate

      - name: Run tests
        env:
          POSTGRES_DB: dacha_test
          POSTGRES_USER: dacha
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
          DJANGO_SETTINGS_MODULE: dacha.settings.test
        run: uv run pytest --cov --cov-report=xml

      - name: Check Django
        env:
          POSTGRES_DB: dacha_test
          POSTGRES_USER: dacha
          POSTGRES_PASSWORD: test
          POSTGRES_HOST: localhost
        run: |
          cd dacha
          uv run python manage.py check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
