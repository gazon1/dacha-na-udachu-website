name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast gate first: catches type errors in seconds instead of after a
  # multi-minute image build. There is no `lint` script in package.json
  # (the Dockerfile comment claiming "run npm run lint separately in CI"
  # was aspirational), so this is a typecheck for app and bot.
  typecheck:
    runs-on: ubuntu-latest
    # tests/rate-limit.test.ts exercises the limiter's SQL against a real
    # Postgres, because the thing worth testing is the single atomic
    # INSERT .. ON CONFLICT statement — a fake would only agree with itself.
    # The suite skips itself when DATABASE_URL is absent, so without this
    # service the multi-instance guarantee would go untested in CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Typecheck app
        run: npm ci --prefer-offline --no-audit --no-fund && npx tsc --noEmit

      # Payment signature verification and seed config are unit-tested —
      # these are the paths where a silent bug means lost money.
      - name: Unit tests
        run: npm test

      - name: Typecheck bot
        run: npm ci --prefix bot --prefer-offline --no-audit --no-fund && npm run typecheck --prefix bot

  build-and-push:
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds are pushed as `pr-<n>` so a branch can be run locally
      # (`docker pull ghcr.io/<owner>/dacha-app:pr-123`) and reviewed with
      # the real image instead of a local rebuild. Tags are cleaned up weekly
      # by prune-ghcr.yml.
      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dacha-app
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image currently ships a full node_modules (no `output: standalone`),
      # so its size drives CI time and registry storage. Surfaced here so the
      # standalone decision can be made from a real number.
      - name: Summarize image
        if: always()
        run: |
          {
            echo "### Image published"
            echo ""
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Built from: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
