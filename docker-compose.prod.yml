  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    #image: dacha-web:latest
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=dacha.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      # DEBUG_PROD=1 disables SECURE_SSL_REDIRECT for local plain-HTTP runs (no TLS terminator).
      # Leave unset or set to 0 in Coolify / prod — Caddy provides X-Forwarded-Proto: https.
      - DEBUG_PROD=${DEBUG_PROD}
      # Comma-separated. Must include the public hostname.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # Scheme+host(s) for CSRF and CORS validation.
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # Used to generate absolute URLs in Wagtail emails / preview links.
      - WAGTAILADMIN_BASE_URL=${WAGTAILADMIN_BASE_URL}
      # Wagtail headless preview — URL the admin opens in its iframe.
      - NEXT_PUBLIC_WAGTAIL_PREVIEW_URL=${NEXT_PUBLIC_WAGTAIL_PREVIEW_URL}
      # --- On-demand revalidation webhook (Django → Next.js) ---
      # See /workspace/backend/dacha/signals.py. Empty values → receivers are no-ops.
      - FRONTEND_REVALIDATE_URL=${FRONTEND_REVALIDATE_URL}
      - FRONTEND_REVALIDATE_SECRET=${FRONTEND_REVALIDATE_SECRET}
      - FRONTEND_REVALIDATE_TIMEOUT=${FRONTEND_REVALIDATE_TIMEOUT:-2.0}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DJANGO_SUPERUSER_USERNAME=${ADMIN_USERNAME}
      - DJANGO_SUPERUSER_EMAIL=${ADMIN_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${ADMIN_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_AUTH_MAX_AGE_SECONDS=${TELEGRAM_AUTH_MAX_AGE_SECONDS:-300}
    # depends_on:
    #   db:
    #     condition: service_healthy
    volumes:
      - media_data:/workspace/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    expose:
      - "8000"
    working_dir: /workspace/backend
    command:
      - sh
      - -c
      - python manage.py makemigrations --noinput && python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn dacha.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile -

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # Server-only build arg — baked into next.config.ts server bundle.
        BACKEND_URL: http://web:8000
        # Public origin — browser-baked at build time. Must end without trailing slash.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
    #image: dacha-frontend:latest
    restart: always
    environment:
      # Server-only (not NEXT_PUBLIC_*). Read at runtime by Next.js rewrites.
      # Not baked into the client bundle.
      - BACKEND_URL=http://web:8000
      # Public — browser-baked at build time.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
      # --- On-demand revalidation (Next.js side; must match FRONTEND_REVALIDATE_SECRET) ---
      # Read at request time by /app/api/revalidate/route.ts.
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----- TLS terminator + reverse proxy (replaces Coolify's external Caddy) -----
  caddy:
    image: caddy:2-alpine
    restart: always
    dns: 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistent ACME account + issued certificates (don't lose these on
      # container restart — avoids Let's Encrypt rate-limit risk).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  media_data:
    name: dacha_media_v1
  caddy_data:
    name: dacha_caddy_data
  caddy_config:
    name: dacha_caddy_config
  # postgres_data:
    # name: dacha_postgres_v1
