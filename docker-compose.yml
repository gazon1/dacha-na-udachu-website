services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Tagged image so old versions can be pruned by tag. Default tag is
    # `latest`; CI should pass `TAG=<commit-sha>` on each build.
    image: dacha-app:${TAG:-latest}
    restart: always
    env_file: .env
    environment:
      # Derived from POSTGRES_* — kept in compose so password rotation
      # touches only .env, not the connection string.
      - PAYLOAD_PUBLIC_SERVER_URL=${PUBLIC_HOST}
    # Wait for the one-shot bootstrap services to finish before starting
    # the app. migrate applies pending schema migrations, seed populates
    # initial data + admin user. Both are idempotent so re-running on
    # every `docker compose up` is safe.
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    # Override the Dockerfile default CMD so the runtime contract lives
    # next to the env vars that drive it (PORT).
    command: ["node_modules/next/dist/bin/next", "start"]
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 180s
    expose:
      - "${PORT}"

  # One-shot DB migration — creates/updates tables to match the schema.
  # Idempotent: only applies pending migrations. Runs automatically on
  # every `docker compose up` because `app` depends on it.
  # Reuses the `app` image — no separate build, no extra disk usage.
  # `pull_policy: never` prevents compose from trying to pull from a registry.
  # Run manually for explicit control: `docker compose run --rm migrate`
  migrate:
    image: dacha-app:${TAG:-latest}
    pull_policy: never
    restart: "no"
    env_file: .env
    environment:
      - PAYLOAD_PUBLIC_SERVER_URL=https://${PUBLIC_HOST}
    command: ["node_modules/.bin/payload", "migrate"]

  # One-shot bootstrap — creates the admin user + starter content.
  # Safe to re-run (skips if records exist). Runs after migrate, then app.
  # Reuses the `app` image (see migrate for rationale).
  # Run manually for explicit control: `docker compose run --rm seed`
  seed:
    image: dacha-app:${TAG:-latest}
    pull_policy: never
    restart: "no"
    env_file: .env
    environment:
      - PAYLOAD_PUBLIC_SERVER_URL=https://${PUBLIC_HOST}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node_modules/.bin/payload", "seed"]

  # db:
  #   image: postgres:16-alpine
  #   restart: always
  #   env_file: .env
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  caddy:
    image: caddy:2-alpine
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  # postgres_data:
    # name: dacha_postgres_v2
  media_data:
    name: dacha_media_v2
  caddy_data:
    name: dacha_caddy_data
  caddy_config:
    name: dacha_caddy_config
