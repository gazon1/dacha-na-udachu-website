# Single image for the whole stack: the Next.js app, the Telegram bot,
# and the one-shot `migrate` / `seed` jobs all come from this build.
# Images are published by CI (.github/workflows/ci.yml) to GHCR and pulled
# here — the VPS does NOT build locally anymore.
#
# TAG is REQUIRED (no default). Silently falling back to `latest` would
# deploy an arbitrary commit, so compose must fail loudly instead:
#   TAG=$(git rev-parse --short HEAD) docker compose up -d
x-app-image: &app-image ghcr.io/gazon1/dacha-app:${TAG:?TAG must be set — use a commit SHA tag from GHCR, e.g. TAG=$(git rev-parse --short HEAD)}

services:
  app:
    image: *app-image
    pull_policy: missing
    container_name: dacha-app
    restart: always
    networks:
      - default
      - caddy_net
    env_file: .env
    environment:
      # Derived from POSTGRES_* — kept in compose so password rotation
      # touches only .env, not the connection string.
      - NODE_ENV=production
      - TRUST_HOST=1
    # Wait for the one-shot bootstrap services to finish before starting
    # the app. migrate applies pending schema migrations, seed populates
    # initial data + admin user. Both are idempotent so re-running on
    # every `docker compose up` is safe.
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
    # Override the Dockerfile default CMD so the runtime contract lives
    # next to the env vars that drive it (PORT).
    command: ["node_modules/next/dist/bin/next", "start"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:${PORT:-3000}/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "${PORT}"

  # Schema backup taken BEFORE `migrate` runs.
  # `payload migrate` is not reversible, so rolling back the image without
  # rolling back the schema only works for additive migrations. This gives a
  # way back when it does not.
  #
  # Uses the official postgres image because the Next.js image ships no
  # pg_dump. DATABASE_URI is a full postgres:// URL, which pg_dump accepts
  # directly as its positional argument — so no host/user/db splitting and no
  # risk of echoing the password in the command line.
  backup:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        ts="$$(date -u +%Y%m%dT%H%M%S)"
        mkdir -p /backups
        echo "→ pg_dump → /backups/pre-$$ts.sql.gz"
        pg_dump "$$DATABASE_URI" --clean --if-exists --no-owner --no-privileges \
          | gzip > "/backups/pre-$$ts.sql.gz"
        # Keep the 10 most recent dumps so the volume cannot fill the disk.
        ls -1t /backups/pre-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm --
        echo "→ backup written"
    volumes:
      - backup_data:/backups

  migrate:
    image: *app-image
    pull_policy: missing
    restart: "no"
    env_file: .env
    depends_on:
      backup:
        condition: service_completed_successfully
    command: ["node_modules/.bin/payload", "migrate"]

  seed:
    image: *app-image
    pull_policy: missing
    restart: "no"
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node_modules/.bin/payload", "seed"]

  bot:
    image: *app-image
    container_name: dacha-bot
    pull_policy: missing
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - TRUST_HOST=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started
    command: ["npx", "tsx", "bot/src/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "3001"
    networks:
      - default
      - caddy_net

volumes:
  media_data:
    name: dacha_media_v2
  # Pre-migration schema dumps, rotated to the 10 most recent by the
  # `backup` service. Restore with:
  #   gunzip < /backups/pre-<ts>.sql.gz | docker compose exec -T db psql ...
  backup_data:
    name: dacha_backup

networks:
  caddy_net:
    external: true
    name: caddy_net
