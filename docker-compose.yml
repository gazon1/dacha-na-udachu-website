services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      # Derived from POSTGRES_* — kept in compose so password rotation
      # touches only .env, not the connection string.
      - PAYLOAD_PUBLIC_SERVER_URL=https://${PUBLIC_HOST}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    # Override the Dockerfile default CMD so the runtime contract lives
    # next to the env vars that drive it (PORT).
    command: ["node_modules/next/dist/bin/next", "start"]
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 180s
    expose:
      - "${PORT}"

  # One-shot bootstrap — creates the admin user on first deploy.
  # Safe to re-run: the seed script is idempotent (skips if admin exists).
  # Triggered manually: `docker compose --profile bootstrap run --rm seed`
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    profiles: ["bootstrap"]
    env_file: .env
    environment:
      - PAYLOAD_PUBLIC_SERVER_URL=https://${PUBLIC_HOST}
    # depends_on:
      # db:
        # condition: service_healthy
    command: ["node_modules/.bin/payload", "seed"]

  # db:
  #   image: postgres:16-alpine
  #   restart: always
  #   env_file: .env
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  caddy:
    image: caddy:2-alpine
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

volumes:
  # postgres_data:
    # name: dacha_postgres_v2
  media_data:
    name: dacha_media_v2
  caddy_data:
    name: dacha_caddy_data
  caddy_config:
    name: dacha_caddy_config
