[project]
name = "my-cms-project"
version = "0.1.0"
description = "A Django CMS 5 Project running on Docker with uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-cms>=5.0.0",
    "psycopg[binary]",
    "gunicorn>=21.2.0",
    "django-classy-tags>=3.0",
    "django-sekizai>=3.0",
    "django-filer>=3.0",
    "easy-thumbnails>=2.8",
    "djangocms-frontend>=1.0",
    "djangocms-text-ckeditor>=5.0",
    "djangocms-link>=3.0",
    "djangocms-picture>=3.0",
    "djangocms-file>=3.0",
    "phonenumbers",
    "whitenoise>=6.11.0",
]

# Группа dev-зависимостей для uv
[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "django-stubs",   # Типизация для Django
    "types-psycopg2", # Типизация для драйвера БД
]

# --------- BUILD SYSTEM (Ваш запрос) ---------------
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --------- UV CONFIG ---------------
[tool.uv]
package = false

# --------- RUFF (Ваш запрос) ---------------
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".env",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "env",
    "node_modules",
    "site-packages",
    "venv",
    "templates",
    "**/migrations/*.py" # Рекомендуется исключать миграции Django из линтинга
]

# Адаптировано под структуру Django (обычно код лежит в корне, а не в src)
src = ["."]

line-length = 120
target-version = "py312" # Обновлено до 3.12 под Dockerfile
respect-gitignore = true

[tool.ruff.lint]
exclude = ["*.ipynb"]

# Правила линтера
select = ["A", "B", "C", "E", "F", "I", "PD", "PL", "Q", "SIM", "W"] 

# Игнорируемые правила
ignore = ['PLR0913']

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Адаптировано: считаем текущий проект first-party
known-first-party = ["mysite", "my_cms_project"] 
section-order = ["future", "standard-library", "third-party",  "first-party", "local-folder"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# --------- MYPY (Ваш запрос) ---------------
[tool.mypy]
python_version = "3.12" # Обновлено до 3.12

# Добавлен плагин для Django, чтобы mypy понимал ORM
plugins = ["mypy_django_plugin.main"]

ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true

[tool.django-stubs]
django_settings_module = "mysite.settings"
