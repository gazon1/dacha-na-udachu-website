# docker-compose.local.yml
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml up
#
# This override disables SECURE_SSL_REDIRECT (DEBUG_PROD=1) so the stack works
# over plain HTTP without a TLS terminator (no Caddy, no nginx).
# Do NOT use this in Coolify — Coolify already provides X-Forwarded-Proto: https.

services:
  web:
    environment:
      - DEBUG_PROD=1
    ports:
      - "8071:8000"

  frontend:
    build:
      args:
        BACKEND_URL: http://web:8000
    environment:
      - BACKEND_URL=http://web:8000
