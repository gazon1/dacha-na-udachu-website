<div class="card {% if self.highlight %}bg-gradient-to-br from-primary/10 via-base-200 to-secondary/10 border-primary/30{% else %}bg-base-200 border-base-300{% endif %} shadow-xl mb-6">
    <div class="card-body">
        <h3 class="card-title text-2xl bg-clip-text text-transparent bg-gradient-to-r {% if self.highlight %}from-primary to-secondary{% else %}from-base-content to-base-content/60{% endif %}">
            {{ self.title }}
        </h3>
        <div class="text-base-content/80 prose prose-sm max-w-none prose-headings:text-primary prose-strong:text-base-content">
            {{ self.text }}
        </div>
    </div>
</div>
