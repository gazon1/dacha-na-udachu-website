<div class="card bg-base-200 shadow-xl mb-6 border border-base-300 hover:border-primary/30 transition-colors duration-300">
    <div class="card-body">
        <h3 class="card-title text-primary">
            <span class="text-2xl">{{ self.icon }}</span>
            {{ self.title }}
        </h3>
        <div class="text-base-content/80 prose prose-sm max-w-none prose-headings:text-primary prose-strong:text-base-content">
            {{ self.content }}
        </div>
    </div>
</div>
