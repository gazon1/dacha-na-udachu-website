<div class="collapse collapse-arrow bg-base-200 border border-base-300 mb-4 hover:border-primary/30 transition-colors duration-300"
     x-data="{ open: false }">
    <input type="checkbox" x-model="open" class="peer" />
    <div class="collapse-title text-base-content font-medium peer-checked:text-primary">
        {{ self.question }}
    </div>
    <div class="collapse-content">
        <div class="pt-2 text-base-content/80 prose prose-sm max-w-none">
            {{ self.answer }}
        </div>
    </div>
</div>
