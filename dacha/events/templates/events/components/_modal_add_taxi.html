{% load crispy_forms_tags %}
{% with form=taxi_pool_form %}{% if form %}
{# ── TAXI MODAL ─────────────────────────────────────────────────────────────── #}
<div x-data="{ open: false }"
     @open-taxi-modal.window="open = true"
     @keydown.escape.window="open = false"
     x-show="open"
     x-trap.inert.noscroll="open"
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     x-cloak>
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="open = false"></div>
    <div class="relative bg-surface border border-stroke rounded-2xl p-6 max-w-md w-full">

        <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold text-white">🚕 Собрать такси</h3>
            <button @click="open = false" class="text-base-content/40 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <form hx-post="{% url 'event_add_taxi_pool' page.slug %}"
              hx-target="#drivers-section"
              hx-swap="innerHTML"
              @htmx:after-request="if(event.detail.successful) open = false"
              class="space-y-4">
            {% csrf_token %}
            {% crispy form %}
            <div class="flex gap-3 pt-2">
                <button type="submit"
                        class="flex-1 py-3 bg-community-magenta hover:brightness-110 text-white rounded-xl font-semibold transition-all">
                    Создать
                </button>
                <button type="button" @click="open = false"
                        class="px-6 py-3 glass-card text-white rounded-xl font-medium hover:bg-white/10 transition-all">
                    Отмена
                </button>
            </div>
        </form>
    </div>
</div>
{% endif %}{% endwith %}
