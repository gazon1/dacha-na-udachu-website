<section class="hero">
    <div class="hero-content">
        {% if value.title %}
        <h1>{{ value.title }}</h1>
        {% endif %}
        {% if value.subtitle %}
        <p>{{ value.subtitle }}</p>
        {% endif %}
        {% if value.button_text and value.button_url %}
        <a href="{{ value.button_url }}" class="btn btn-primary">{{ value.button_text }}</a>
        {% endif %}
    </div>
</section>
