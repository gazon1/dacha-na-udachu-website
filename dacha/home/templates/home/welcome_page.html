{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="max-w-2xl w-full text-center space-y-8">
        {# Icon #}
        <div class="flex justify-center">
            <div class="glass-card w-24 h-24 rounded-full flex items-center justify-center">
                <span class="material-symbols-outlined text-5xl text-primary">cottage</span>
            </div>
        </div>

        {# Heading #}
        <div>
            <p class="text-sm text-base-content/40 uppercase tracking-widest mb-3">Добро пожаловать</p>
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
                Добро пожаловать на сайт!
            </h1>
            <p class="text-lg text-base-content/60 max-w-md mx-auto">
                Управляйте контентом через
                <a href="{% url 'wagtailadmin_home' %}" class="text-primary hover:underline">Wagtail admin</a>.
            </p>
        </div>

        {# Quick links #}
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <a href="{% url 'wagtailadmin_home' %}"
               class="glass-card rounded-2xl p-6 text-center hover:border-primary/30 transition-all group">
                <span class="material-symbols-outlined text-3xl text-primary mb-2 block">settings</span>
                <span class="text-sm font-medium text-white group-hover:text-primary transition-colors">Админка</span>
            </a>
            <a href="/"
               class="glass-card rounded-2xl p-6 text-center hover:border-primary/30 transition-all group">
                <span class="material-symbols-outlined text-3xl text-primary mb-2 block">home</span>
                <span class="text-sm font-medium text-white group-hover:text-primary transition-colors">Главная</span>
            </a>
            <a href="/booking/"
               class="glass-card rounded-2xl p-6 text-center hover:border-primary/30 transition-all group">
                <span class="material-symbols-outlined text-3xl text-primary mb-2 block">calendar_month</span>
                <span class="text-sm font-medium text-white group-hover:text-primary transition-colors">Бронирование</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
