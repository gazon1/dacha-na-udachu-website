{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<div class="container">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}

    {% if page.body %}
        {% for block in page.body %}
            {% include_block block %}
        {% endfor %}
    {% endif %}

    <div class="booking-section">
        <a href="/booking/?house={{ page.slug }}" class="btn">Забронировать</a>
    </div>
</div>
{% endblock %}
