{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h1>Бронирование</h1>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'submit_booking' %}" class="booking-form" x-data="bookingForm()">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="booking-summary" x-show="nights > 0">
            <h3>Итого</h3>
            <p><span x-text="nights"></span> ночей</p>
        </div>

        <button type="submit" class="btn btn-primary">Отправить заявку</button>
    </form>
</div>
{% endblock %}
