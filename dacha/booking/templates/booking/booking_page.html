{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h1>Бронирование</h1>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'submit_booking' %}" class="booking-form" x-data="bookingForm()">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="booking-summary" x-show="nights > 0">
            <h3>Итого</h3>
            <p><span x-text="nights"></span> ночей</p>
        </div>

        <button type="submit" class="btn btn-primary">Отправить заявку</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function bookingForm() {
  return {
    nights: 0,

    init() {
      const checkIn = document.querySelector('[name="check_in"]');
      const checkOut = document.querySelector('[name="check_out"]');

      if (checkIn && checkOut) {
        checkIn.addEventListener('change', () => this.calculate());
        checkOut.addEventListener('change', () => this.calculate());
      }
    },

    calculate() {
      const checkIn = document.querySelector('[name="check_in"]');
      const checkOut = document.querySelector('[name="check_out"]');

      if (checkIn && checkOut && checkIn.value && checkOut.value) {
        const d1 = new Date(checkIn.value);
        const d2 = new Date(checkOut.value);
        const diff = (d2 - d1) / (1000 * 60 * 60 * 24);
        this.nights = diff > 0 ? diff : 0;
      } else {
        this.nights = 0;
      }
    }
  }
}
</script>
{% endblock %}
