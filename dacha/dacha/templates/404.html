{% extends "base.html" %}

{% block title %}Страница не найдена — 404{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center space-y-6">
        <span class="material-symbols-outlined text-8xl text-primary/30 block mx-auto">search_off</span>
        <div>
            <p class="text-sm text-base-content/40 uppercase tracking-widest mb-2">404</p>
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Страница не найдена</h1>
            <p class="text-base-content/60">
                Возможно, она переехала или была удалена. Попробуйте вернуться на главную.
            </p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <a href="/" class="btn btn-primary gap-2">
                <span class="material-symbols-outlined">home</span>
                На главную
            </a>
            <a href="/search/" class="btn btn-ghost gap-2">
                <span class="material-symbols-outlined">search</span>
                Поиск
            </a>
        </div>
    </div>
</div>
{% endblock %}
