<!DOCTYPE html>
{# Standalone — no extends to avoid cascading errors on 500 #}
<html lang="ru" data-theme="community">
<head>
    <meta charset="utf-8" />
    <title>Ошибка сервера — 500</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --color-brand-500: #7fba2f;
            --color-primary: #ccff80;
            --color-base-100: #0b1326;
            --color-base-content: #dae2fd;
            --color-surface-2: #1d2341;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b1326;
            color: #dae2fd;
            font-family: system-ui, sans-serif;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(29, 35, 65, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 3rem 2rem;
            max-width: 28rem;
            width: 100%;
            text-align: center;
        }
        .material-symbols-outlined { font-family: "Material Symbols Outlined"; font-size: 5rem; opacity: 0.3; }
        .title { font-size: 2rem; font-weight: 700; color: #fff; margin: 1rem 0; }
        .subtitle { color: rgba(218, 226, 253, 0.6); margin-bottom: 2rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 1.5rem; border-radius: 0.75rem;
            font-weight: 500; text-decoration: none; transition: all 0.2s;
        }
        .btn-primary { background: #ccff80; color: #213600; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-ghost { background: transparent; color: rgba(218, 226, 253, 0.6); border: 1px solid rgba(255,255,255,0.1); }
        .btn-ghost:hover { color: #dae2fd; border-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="card">
        <span class="material-symbols-outlined">error</span>
        <h1 class="title">Ошибка сервера</h1>
        <p class="subtitle">Что-то пошло не так. Мы уже знаем и скоро всё починим.</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
            <a href="/" class="btn btn-primary">На главную</a>
            <a href="/admin/" class="btn btn-ghost">Админка</a>
        </div>
    </div>
</body>
</html>
