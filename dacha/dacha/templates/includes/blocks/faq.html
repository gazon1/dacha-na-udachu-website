{# FAQ accordion block — Alpine + @alpinejs/collapse powered #}
<div class="collapse collapse-arrow bg-base-200 border border-white/10 mb-4
            hover:border-primary/30 transition-colors"
     x-data="{ open: false }">
    <input type="checkbox" x-model="open" class="peer" />
    <div class="collapse-title text-base-content font-medium peer-checked:text-primary
                flex items-center gap-3">
        {% if value.icon %}
        <span class="material-symbols-outlined text-primary text-lg">{{ value.icon }}</span>
        {% endif %}
        {{ value.question }}
    </div>
    <div class="collapse-content">
        <div class="pt-3 pb-2 prose prose-sm prose-invert max-w-none text-base-content/80">
            {{ value.answer }}
        </div>
    </div>
</div>
