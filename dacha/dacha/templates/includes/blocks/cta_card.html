{# CTA card block — accent/highlight card #}
<div class="rounded-2xl mb-6 overflow-hidden
            {% if value.highlight %}
            glass-card bonfire-glow border border-community-magenta/20
            {% else %}
            bg-base-200 border border-white/10
            {% endif %}">
    <div class="p-6">
        <h3 class="text-xl font-semibold mb-3
                   {% if value.highlight %}
                   bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent
                   {% else %}
                   text-white
                   {% endif %}">
            {{ value.title }}
        </h3>
        <div class="prose prose-sm prose-invert max-w-none text-base-content/80">
            {{ value.text }}
        </div>
    </div>
</div>
