{# Info card block — icon + title + rich-text (amenities, dress-code, etc.) #}
<div class="glass-card rounded-2xl p-6 mb-6 border border-white/10 hover:border-primary/30 transition-colors">
    <div class="flex items-start gap-4">
        {% if value.icon %}
        <span class="material-symbols-outlined text-primary text-3xl flex-shrink-0 mt-0.5">
            {{ value.icon }}
        </span>
        {% endif %}
        <div class="flex-1">
            <h3 class="text-lg font-semibold text-white mb-2">{{ value.title }}</h3>
            <div class="prose prose-sm prose-invert max-w-none text-base-content/80">
                {{ value.content }}
            </div>
        </div>
    </div>
</div>
