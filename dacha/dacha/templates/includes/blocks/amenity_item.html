{% load wagtailcore_tags %}
{# amenity_item.html — single amenity icon+label card, used inside AmenitiesBlock grid #}
{% with block.value as item %}
{% if item.icon and item.label %}
<div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center gap-3">
    <span class="material-symbols-outlined text-primary text-[32px]">{{ item.icon }}</span>
    <span class="text-sm font-medium">{{ item.label }}</span>
</div>
{% endif %}
{% endwith %}
