{# Newsletter signup block — htmx-powered inline form #}
{# Uses HX-Trigger header for success toast (django-htmx) #}
<section class="py-16 {{ value.class|default:"" }}">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="glass-card rounded-3xl p-8 md:p-12">
            <div class="max-w-xl mx-auto text-center">
                {% if value.title %}
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-3">{{ value.title }}</h2>
                {% endif %}

                {% if value.description %}
                <p class="text-base-content/60 mb-8">{{ value.description|linebreaks }}</p>
                {% endif %}

                <form
                    hx-post="/newsletter/"
                    hx-swap="outerHTML"
                    hx-indicator=".newsletter-indicator"
                    class="flex flex-col sm:flex-row gap-3"
                    novalidate>
                    {% csrf_token %}
                    <input
                        type="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        class="input input-bordered flex-1 bg-base-200 border-white/10 focus:border-primary"
                        x-mask="email">
                    <button type="submit" class="btn btn-primary gap-2">
                        <span class="newsletter-indicator htmx-request:hidden">Подписаться</span>
                        <span class="newsletter-indicator htmx-loading htmx-request:inline hidden">
                            <span class="loading loading-spinner loading-sm"></span>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
