{# Hero block — title + subtitle + CTA #}
<section class="relative overflow-hidden py-20 md:py-32">
    {# Ambient glows #}
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-secondary/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        {% if value.title %}
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-white mb-6 leading-tight">
            {{ value.title }}
        </h1>
        {% endif %}

        {% if value.subtitle %}
        <p class="text-lg md:text-xl text-base-content/70 max-w-2xl mb-8">
            {{ value.subtitle|linebreaks }}
        </p>
        {% endif %}

        {% if value.button_text and value.button_url %}
        <a href="{{ value.button_url }}"
           class="btn btn-primary btn-lg inline-flex items-center gap-2 text-lg px-8 py-4">
            {{ value.button_text }}
            <span class="material-symbols-outlined">arrow_forward</span>
        </a>
        {% endif %}
    </div>
</section>
