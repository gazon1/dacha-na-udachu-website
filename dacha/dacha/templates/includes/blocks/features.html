{# Features block — icon + text chips grid #}
<section class="py-16 md:py-20 {{ value.class|default:"" }}">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        {% if value.title %}
        <h2 class="text-2xl md:text-3xl font-bold text-primary mb-10">{{ value.title }}</h2>
        {% endif %}

        <div class="flex flex-wrap gap-4">
            {% for feature in value.features %}
            <div class="glass-card rounded-2xl px-5 py-4 flex items-center gap-3">
                {% if feature.icon %}
                <span class="material-symbols-outlined text-primary text-xl">{{ feature.icon }}</span>
                {% endif %}
                <span class="text-base-content font-medium">{{ feature.text }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
