<header class="site-header" x-data="{ mobileOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Logo -->
            <a href="/" class="flex items-center gap-2 text-white font-semibold text-lg hover:text-brand-400 transition-colors">
                <span>🏠</span>
                <span>Dacha</span>
            </a>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center gap-8">
                <a href="/houses/" class="text-gray-300 hover:text-white transition-colors">Дома</a>
                <a href="/events/" class="text-gray-300 hover:text-white transition-colors">События</a>
                <a href="/faq/" class="text-gray-300 hover:text-white transition-colors">FAQ</a>
                <a href="/booking/" class="inline-flex items-center px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg font-medium transition-colors">
                    Забронировать
                </a>
            </nav>

            <!-- Mobile Menu Button -->
            <button
                @click="mobileOpen = !mobileOpen"
                class="md:hidden p-2 text-gray-300 hover:text-white"
                aria-label="Toggle menu"
            >
                <svg x-show="!mobileOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg x-show="mobileOpen" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Mobile Nav -->
        <nav
            x-show="mobileOpen"
            x-cloak
            class="md:hidden pb-4 space-y-2"
            x-transition
        >
            <a href="/houses/" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-surface-2 rounded-lg transition-colors">Дома</a>
            <a href="/events/" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-surface-2 rounded-lg transition-colors">События</a>
            <a href="/faq/" class="block px-4 py-2 text-gray-300 hover:text-white hover:bg-surface-2 rounded-lg transition-colors">FAQ</a>
            <a href="/booking/" class="block px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-lg font-medium text-center transition-colors">
                Забронировать
            </a>
        </nav>
    </div>
</header>
