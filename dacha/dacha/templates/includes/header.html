{% load static wagtailcore_tags %}

<header class="sticky top-0 z-50 bg-base-100/80 backdrop-blur-md border-b border-white/5"
        x-data="{ mobileMenuOpen: false }">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            {# Logo #}
            <a href="/" class="flex items-center gap-2 text-white font-semibold text-lg hover:text-primary transition-colors">
                <span>🏠</span>
                <span>Dacha</span>
            </a>

            {# Desktop Nav #}
            <nav class="hidden md:flex items-center gap-8" aria-label="Main navigation">
                <a href="/houses/" class="text-base-content/70 hover:text-white transition-colors text-sm font-medium">Дома</a>
                <a href="/events/" class="text-base-content/70 hover:text-white transition-colors text-sm font-medium">События</a>
                <a href="/faq/" class="text-base-content/70 hover:text-white transition-colors text-sm font-medium">FAQ</a>
                <a href="/news/" class="text-base-content/70 hover:text-white transition-colors text-sm font-medium">Новости</a>
                <a href="/booking/"
                   class="inline-flex items-center px-4 py-2 bg-primary text-[#213600] rounded-lg font-medium text-sm hover:brightness-110 transition-all">
                    Забронировать
                </a>
            </nav>

            {# Mobile Menu Button #}
            <button
                @click="mobileMenuOpen = !mobileMenuOpen"
                :aria-expanded="mobileMenuOpen.toString()"
                aria-controls="mobile-menu"
                aria-label="Открыть меню"
                class="md:hidden p-2 text-base-content/70 hover:text-white transition-colors">
                <span x-show="!mobileMenuOpen" class="material-symbols-outlined">menu</span>
                <span x-show="mobileMenuOpen" x-cloak class="material-symbols-outlined">close</span>
            </button>
        </div>

        {# Mobile Nav #}
        <nav
            id="mobile-menu"
            x-show="mobileMenuOpen"
            x-cloak
            class="md:hidden pb-4 space-y-1"
            x-transition>
            <a href="/houses/" class="block px-4 py-2 text-base-content/70 hover:text-white hover:bg-surface-2 rounded-lg transition-colors text-sm font-medium">Дома</a>
            <a href="/events/" class="block px-4 py-2 text-base-content/70 hover:text-white hover:bg-surface-2 rounded-lg transition-colors text-sm font-medium">События</a>
            <a href="/faq/" class="block px-4 py-2 text-base-content/70 hover:text-white hover:bg-surface-2 rounded-lg transition-colors text-sm font-medium">FAQ</a>
            <a href="/news/" class="block px-4 py-2 text-base-content/70 hover:text-white hover:bg-surface-2 rounded-lg transition-colors text-sm font-medium">Новости</a>
            <a href="/booking/"
               class="block px-4 py-2 bg-primary text-[#213600] rounded-lg font-medium text-sm text-center mt-2 hover:brightness-110 transition-all">
                Забронировать
            </a>
        </nav>
    </div>
</header>
