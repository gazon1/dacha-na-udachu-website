{# Reusable button — variants: primary | secondary | ghost | outline | magenta #}
{# Usage: {% include "includes/components/_button.html" with variant="primary" text="Click me" href="/url" %} #}

{% if href %}
<a href="{{ href|default:"#" }}"
   class="btn btn-{{ variant|default:"primary" }} {{ class|default:"" }}"
   {{ extra|default:"" }}>
    {% if icon %}<span class="material-symbols-outlined{{ icon_class|default:"" }}">{{ icon }}</span>{% endif %}
    {{ text|default:"" }}
</a>
{% else %}
<button type="{{ type|default:"button" }}"
        class="btn btn-{{ variant|default:"primary" }} {{ class|default:"" }}"
        {{ extra|default:"" }}>
    {% if icon %}<span class="material-symbols-outlined{{ icon_class|default:"" }}">{{ icon }}</span>{% endif %}
    {{ text|default:"" }}
</button>
{% endif %}
