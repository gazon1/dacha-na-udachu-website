{# Toast notification overlay — Alpine store-driven #}
{# Include once in _layout_foot.html or base.html before </body> #}
{# Alpine.store("toast").show(message, type) — type: info|success|warning|error #}

<div x-data="{ toast: Alpine.store('toast') }"
     x-show="toast.visible"
     x-cloak
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-4 scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed bottom-6 right-6 z-[9999] pointer-events-none"
     role="status"
     aria-live="polite">
    <div class="glass-card rounded-2xl px-5 py-4 flex items-center gap-3 pointer-events-auto min-w-[280px] max-w-sm"
         :class="{
             'border-l-4 border-primary': toast.type === 'info' || toast.type === '',
             'border-l-4 border-success': toast.type === 'success',
             'border-l-4 border-warning': toast.type === 'warning',
             'border-l-4 border-error': toast.type === 'error'
         }">
        <span class="material-symbols-outlined text-lg flex-shrink-0"
              :class="{
                  'text-primary': toast.type === 'info' || toast.type === '',
                  'text-success': toast.type === 'success',
                  'text-warning': toast.type === 'warning',
                  'text-error': toast.type === 'error'
              }"
              x-text="toast.type === 'success' ? 'check_circle' :
                      toast.type === 'warning' ? 'warning' :
                      toast.type === 'error' ? 'error' : 'info'"></span>
        <p class="text-sm text-white flex-1" x-text="toast.message"></p>
        <button @click="toast.visible = false"
                class="text-base-content/40 hover:text-base-content transition-colors flex-shrink-0">
            <span class="material-symbols-outlined text-sm">close</span>
        </button>
    </div>
</div>
