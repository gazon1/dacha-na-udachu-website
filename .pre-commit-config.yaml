repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-secrets
        # Requires: pip install pre-commit-detect-secrets
        # Or use: rev: v1.0.0 with `pip install detect-secrets`

  - repo: https://github.com/jbergstroem/mirrors-nodejs
    rev: v22.13.1
    hooks:
      - id: node-version
